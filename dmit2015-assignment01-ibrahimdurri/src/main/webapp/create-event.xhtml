<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<h:head>
    <title>Create Campus Event</title>
</h:head>

<h:body>

    <h2>DMIT2015-1261 Assignment 1 by Ibrahim Durri</h2>

    <h:form>

        <p:messages id="messages" />

        <p:panelGrid columns="2">

            <p:outputLabel for="eventName" value="Event Name:" />
            <p:inputText id="eventName"
                         value="#{campusEventBean.eventName}"
                         required="true"
                         requiredMessage="Event name is required.">
                <f:validateLength minimum="5" />
            </p:inputText>

            <p:outputLabel for="organizerName" value="Organizer Name:" />
            <p:inputText id="organizerName"
                         value="#{campusEventBean.organizerName}"
                         required="true"
                         requiredMessage="Organizer name is required." />

            <p:outputLabel for="eventDate" value="Event Date:" />
            <p:datePicker id="eventDate"
                          pattern="yyyy-MM-dd"/>

            <p:outputLabel for="capacity" value="Capacity:" />
            <p:inputNumber id="capacity"
                           value="#{campusEventBean.capacity}"
                           minValue="1"
                           decimalPlaces="0"
                           required="true" />

        </p:panelGrid>

        <br/>

        <p:commandButton value="Create Event"
                         action="#{campusEventBean.createEvent}"
                         update="@form" />

    </h:form>

</h:body>
</html>
